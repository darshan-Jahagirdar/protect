title: "PHP core flaw on a managed WordPress host (WP Engine first)"
items:
  - key: host_status
    kind: manual
    text: "Check {host}'s status page or announcements for its patch status for {advisory_ids}."
  - key: php_version
    kind: manual
    text: "In the host's control panel, confirm this site's PHP version. If you can choose, switch to {fix_text}."
  - key: host_ticket
    kind: manual
    text: "If it isn't patched within 4 hours, open a support ticket with the host and note the ticket reference here."
  - key: edge_rules
    kind: manual
    text: "Confirm edge protection is on: Cloudflare managed WAF rules (if the site is behind Cloudflare) or the host's own firewall. Not 'Under Attack' mode, which is a DDoS challenge."
  - key: origin_lock
    kind: manual
    text: "If the site is behind Cloudflare, confirm the origin only accepts traffic from Cloudflare, or note that it can't."
  - key: report_shows_fix
    kind: auto
    text: "The site's next report shows {fix_text}. Press 'Report now' in the plugin to speed this up."
  - key: file_checks
    kind: manual
    text: "Review this site's file-check results for signs of tampering."
  - key: client_notice
    kind: manual
    text: "Approve and send the client notice."
