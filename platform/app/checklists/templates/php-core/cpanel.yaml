title: "PHP core flaw on shared / cPanel hosting"
items:
  - key: host_status
    kind: manual
    text: "Check {host}'s announcements: shared hosts often patch PHP centrally for every account."
  - key: php_selector
    kind: manual
    text: "In cPanel (MultiPHP Manager or Select PHP Version), check which PHP version this site uses."
  - key: php_switch
    kind: manual
    text: "If the host offers {fix_text}, switch the site to it. Otherwise open a ticket asking when it will be patched, and note the reference here."
  - key: edge_rules
    kind: manual
    text: "Confirm edge protection is on: Cloudflare managed WAF rules (if the site is behind Cloudflare). Not 'Under Attack' mode, which is a DDoS challenge."
  - key: origin_lock
    kind: manual
    text: "If the site is behind Cloudflare, confirm the origin only accepts traffic from Cloudflare, or note that it can't."
  - key: report_shows_fix
    kind: auto
    text: "The site's next report shows {fix_text}. Press 'Report now' in the plugin to speed this up."
  - key: file_checks
    kind: manual
    text: "Review this site's file-check results for signs of tampering."
  - key: client_notice
    kind: manual
    text: "Approve and send the client notice."
