title: "PHP core flaw on a server we manage (VPS / cloud)"
items:
  - key: php_upgrade
    kind: manual
    text: "Upgrade PHP to {fix_text} with the server's package manager or your build process."
  - key: restart
    kind: manual
    text: "Restart Apache (mod_php) or PHP-FPM so the new PHP is actually serving requests."
  - key: same_server
    kind: manual
    text: "Check the other sites in this server group: one upgrade may fix several."
  - key: edge_rules
    kind: manual
    text: "Until the upgrade is live, confirm edge protection is on: Cloudflare managed WAF rules (if the site is behind Cloudflare). Not 'Under Attack' mode. {edge_status}"
  - key: origin_lock
    kind: manual
    text: "If the site is behind Cloudflare, confirm the origin only accepts traffic from Cloudflare, or note that it can't."
  - key: report_shows_fix
    kind: auto
    text: "The site's next report shows {fix_text}. Press 'Report now' in the plugin to speed this up."
  - key: file_checks
    kind: manual
    text: "Review this site's file-check results for signs of tampering."
  - key: client_notice
    kind: manual
    text: "Approve and send the client notice."
